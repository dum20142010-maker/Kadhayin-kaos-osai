name: Build & Asset Validation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Typecheck, Asset Integrity & Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Static Typecheck & Pre-Build Asset Validation
        run: npm run build:check

      - name: Compile Production Bundle & Verify Dist Integrity
        run: npm run build
